databaseChangeLog:
  - changeSet:
      id: 003-create-user-roles-table
      author: Pitisha96
      context: dev

      preConditions:
        - dbms:
            type: postgresql
        - not:
            tableExists:
              tableName: user_roles

      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: users
                    referencedColumnName: id
                    foreignKeyName: fk_users_user_roles
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: roles
                    referencedColumnName: id
                    foreignKeyName: fk_roles_user_roles

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: 1
              - column:
                  name: role_id
                  value: 2

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: 2
              - column:
                  name: role_id
                  value: 1


      rollback:
        - dropTable:
            tableName: user_roles
