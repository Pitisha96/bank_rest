databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: Pitisha96
      context: dev

      preConditions:
        - dbms:
            type: postgresql
        - tableExists:
            tableName: roles
        - not:
            tableExists:
              tableName: users

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: roles
                    referencedColumnName: id
                    foreignKeyName: fk_users_roles

      rollback:
        - dropTable:
            tableName: users
