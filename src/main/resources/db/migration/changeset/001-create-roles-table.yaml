databaseChangeLog:
  - changeSet:
      id: 001-create-roles-table
      author: Pitisha96
      context: dev

      preConditions:
        - dbms:
            type: postgresql
        - not:
            tableExists:
              tableName: roles

      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
                    checkConstraint: "name ~ '^ROLE_.+'"

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_USER

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_ADMIN

      rollback:
        - dropTable:
            tableName: roles
